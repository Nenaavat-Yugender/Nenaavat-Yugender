<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Hi, I'm Yugandar, Software Engineer at VMock India Pvt Ltd">
  <title>Hi, I'm Yugandar - Software Engineer @ VMock India Pvt Ltd</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Shimmering name gradient -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" spreadMethod="repeat" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.65" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;520 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>

    <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Typing reveals: each line's clip grows, holds, then resets with the loop -->
    <clipPath id="t1"><rect x="560" y="118" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.14;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="t2"><rect x="560" y="142" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.16;0.18;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="t3"><rect x="560" y="174" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.24;0.36;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="t4"><rect x="560" y="198" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.38;0.40;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="t5"><rect x="560" y="230" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.46;0.56;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="t6"><rect x="560" y="254" height="24" width="380"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.58;0.60;0.93;1" values="0;0;380;380;0"/></rect></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Consolas, monospace; }
    .wave { transform-origin: 157px 94px; transform-box: view-box; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-8deg); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 19s ease-in-out infinite alternate; }
    .orb3 { animation: drift3 13s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(140px, 60px); } }
    @keyframes drift2 { to { transform: translate(-160px, -40px); } }
    @keyframes drift3 { to { transform: translate(90px, -70px); } }
    .dot { animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-14px); opacity: .9; } }
    .ring { animation: pulse 2s ease-out infinite; transform-origin: 63px 287px; transform-box: view-box; }
    @keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(2.6); opacity: 0; } }
  </style>

  <!-- Background: night sky, drifting aurora, grid -->
  <rect width="1000" height="340" rx="18" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.55">
    <circle class="orb1" cx="180" cy="80" r="130" fill="#0ea5e9"/>
    <circle class="orb2" cx="760" cy="260" r="150" fill="#7c3aed"/>
    <circle class="orb3" cx="480" cy="300" r="110" fill="#db2777"/>
  </g>
  <rect width="1000" height="340" rx="18" fill="url(#grid)"/>

  <!-- Floating particles -->
  <g fill="#e0f2fe">
    <circle class="dot" cx="420" cy="60" r="1.6" style="animation-delay:0s"/>
    <circle class="dot" cx="505" cy="110" r="1.2" style="animation-delay:1.3s"/>
    <circle class="dot" cx="300" cy="300" r="1.4" style="animation-delay:2.1s"/>
    <circle class="dot" cx="960" cy="60" r="1.6" style="animation-delay:.7s"/>
    <circle class="dot" cx="520" cy="300" r="1.3" style="animation-delay:3.2s"/>
    <circle class="dot" cx="40" cy="190" r="1.2" style="animation-delay:4s"/>
    <circle class="dot" cx="955" cy="300" r="1.4" style="animation-delay:2.6s"/>
  </g>

  <!-- Left: identity -->
  <g class="sans">
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.182;1" dur="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.182;1" dur="1.1s" fill="freeze"/>
      <text x="56" y="100" font-size="22" fill="#cbd5e1">Hi there</text>
      <text class="wave" x="146" y="100" font-size="22">👋</text>
      <text x="180" y="100" font-size="22" fill="#cbd5e1">I'm</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.4;1" dur="1.5s" fill="freeze"/>
      <text x="54" y="166" font-size="64" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="-1">Yugandar</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.526;1" dur="1.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.526;1" dur="1.9s" fill="freeze"/>
      <text x="56" y="210" font-size="21" font-weight="600" fill="#f1f5f9">Software Engineer
        <tspan fill="#64748b"> @ </tspan><tspan fill="#38bdf8">VMock India Pvt Ltd</tspan></text>
      <text x="56" y="240" font-size="15" fill="#94a3b8">Building AI-powered career tools · mastering algorithms · exploring AI</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.609;1" dur="2.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.609;1" dur="2.3s" fill="freeze"/>
      <circle class="ring" cx="63" cy="287" r="5" fill="none" stroke="#22c55e" stroke-width="2"/>
      <circle cx="63" cy="287" r="5" fill="#22c55e"/>
      <text x="78" y="292" font-size="14" fill="#86efac">Currently building · open to collaborate</text>
    </g>
  </g>

  <!-- Right: terminal -->
  <g filter="url(#shadow)">
    <rect x="540" y="56" width="410" height="236" rx="12" fill="#0b1220" fill-opacity="0.92" stroke="url(#termBorder)" stroke-width="1.2"/>
  </g>
  <rect x="540.6" y="56.6" width="408.8" height="30" rx="11.5" fill="#111a2e"/>
  <rect x="540.6" y="76" width="408.8" height="10.6" fill="#111a2e"/>
  <circle cx="562" cy="71" r="5.5" fill="#ff5f57"/>
  <circle cx="580" cy="71" r="5.5" fill="#febc2e"/>
  <circle cx="598" cy="71" r="5.5" fill="#28c840"/>
  <text x="745" y="75.5" text-anchor="middle" class="mono" font-size="12" fill="#64748b">yugandar@vmock: ~</text>

  <g class="mono" font-size="14">
    <text x="560" y="135" clip-path="url(#t1)"><tspan fill="#22c55e">❯</tspan><tspan fill="#38bdf8"> whoami</tspan></text>
    <text x="560" y="159" clip-path="url(#t2)" fill="#e2e8f0">  yugandar · software engineer</text>

    <text x="560" y="191" clip-path="url(#t3)"><tspan fill="#22c55e">❯</tspan><tspan fill="#38bdf8"> cat stack.txt</tspan></text>
    <text x="560" y="215" clip-path="url(#t4)" fill="#e2e8f0">  react · typescript · node · python</text>

    <text x="560" y="247" clip-path="url(#t5)"><tspan fill="#22c55e">❯</tspan><tspan fill="#38bdf8"> echo $NEXT</tspan></text>
    <text x="560" y="271" clip-path="url(#t6)" fill="#f472b6">  "shipping smarter products with AI"</text>
  </g>
  <rect class="cursor" x="560" y="278" width="9" height="3" fill="#e2e8f0"/>
</svg>
