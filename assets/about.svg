<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="About Yugandar: Software Engineer at VMock India Pvt Ltd">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0220"/><stop offset="1" stop-color="#14062e"/></linearGradient>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#ff2bd6"/><stop offset=".33" stop-color="#7df9ff"/><stop offset=".66" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff2bd6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect x="20" y="20" width="1160" height="290" rx="18"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" fill-opacity=".18"/></pattern>
</defs>
<rect x="20" y="20" width="1160" height="290" rx="18" fill="url(#bg)"/>
<rect x="20" y="20" width="1160" height="290" rx="18" fill="url(#dots)"/>
<g clip-path="url(#card)"><rect x="-300" y="20" width="260" height="290" fill="url(#holo)" transform="skewX(-20)"><animate attributeName="x" values="-300;1500" dur="5s" repeatCount="indefinite"/></rect></g>
<rect x="20" y="20" width="1160" height="290" rx="18" fill="none" stroke="url(#sweep)" stroke-width="2.5" filter="url(#g)"/>
