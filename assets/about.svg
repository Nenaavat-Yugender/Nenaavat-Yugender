  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.667;1" dur="1.50s" fill="freeze"/>
    <text x="70" y="182" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,monospace" font-size="17"><tspan fill="#ff5fd2">❯</tspan><tspan fill="#7df9ff"> building</tspan><tspan fill="#64748b">: </tspan><tspan fill="#f5f3ff">AI-powered career-readiness products</tspan></text></g>
